plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.182'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'info'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        arguments.add '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    maven { url = 'https://maven.theillusivec4.top' }
    maven { url = 'https://maven.kosmx.dev/' }
    maven { url = 'https://code.redspace.io/releases' }
    maven { url = 'https://code.redspace.io/snapshots' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    implementation "io.redspace:irons_spellbooks:${irons_spellbooks_version}"
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    implementation "dev.kosmx.player-anim:player-animation-lib-forge:${player_animator_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}"
    implementation "io.redspace:irons_lib:${irons_lib_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

tasks.matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}

tasks.withType(ProcessResources).configureEach {
    def replacements = [
            minecraft_version_range       : minecraft_version_range,
            neo_version_range             : neo_version_range,
            loader_version_range          : loader_version_range,
            irons_spellbooks_version_range: irons_spellbooks_version_range,
            mod_id                        : mod_id,
            mod_name                      : mod_name,
            mod_version                   : mod_version,
            mod_license                   : mod_license,
            mod_authors                   : mod_authors,
            mod_description               : mod_description
    ]
    inputs.properties replacements
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replacements
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

java {
    withSourcesJar()
}
